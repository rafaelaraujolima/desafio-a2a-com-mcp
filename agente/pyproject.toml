[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-salas"
version = "1.0.0"
description = "Agente A2A da Central de Salas (host MCP por dentro)"
requires-python = ">=3.10"
# mcp==2.3.0 so fornece starlette/uvicorn; o cliente MCP do SDK NAO e usado (precisamos do input_required cru).
dependencies = ["mcp==2.3.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
